services:
  server:
    image: crpi-x67c1bi6evtlgf1e.cn-hongkong.personal.cr.aliyuncs.com/roc-shen-hk/mc-server:${BMC_IMAGE_TAG:?BMC_IMAGE_TAG is required}
    container_name: better-mc-remake-server
    restart: unless-stopped
    env_file:
      - .env
    environment:
      BMC_DATABASE_PATH: /app/server/data/battermc.db
      BMC_SERVE_WEB: "0"
    volumes:
      - server-data:/app/server/data
    expose:
      - "8099"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8099/healthz', timeout=4)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  web:
    image: crpi-x67c1bi6evtlgf1e.cn-hongkong.personal.cr.aliyuncs.com/roc-shen-hk/mc-web:${BMC_IMAGE_TAG:?BMC_IMAGE_TAG is required}
    container_name: better-mc-remake-web
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
    ports:
      - "127.0.0.1:8099:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  server-data:
