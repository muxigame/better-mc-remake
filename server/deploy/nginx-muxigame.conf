server {
    listen 80;
    listen [::]:80;
    server_name mc.muxigame.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://mc.muxigame.com$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name mc.muxigame.com;

    ssl_certificate /etc/letsencrypt/live/mc.muxigame.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mc.muxigame.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    ssl_session_cache shared:MUXIGAME_SSL:10m;
    ssl_session_tickets off;

    location / {
        proxy_pass http://127.0.0.1:8099;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
