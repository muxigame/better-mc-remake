upstream battermc_api {
    server server:8099;
    keepalive 16;
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://battermc_api;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    location = /download {
        proxy_pass http://battermc_api;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    location = /healthz {
        proxy_pass http://battermc_api;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    location ^~ /media/ {
        proxy_pass https://muxigame-prod-static-cn.oss-cn-hangzhou.aliyuncs.com/bmc/site/assets/;
        proxy_set_header Host muxigame-prod-static-cn.oss-cn-hangzhou.aliyuncs.com;
        proxy_ssl_server_name on;
        proxy_ssl_name muxigame-prod-static-cn.oss-cn-hangzhou.aliyuncs.com;
        proxy_hide_header Content-Disposition;
        proxy_hide_header x-oss-force-download;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:css|js|svg|png|jpg|jpeg|webp|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
