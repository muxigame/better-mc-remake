[package]
name = "battermc5remake"
version = "0.0.0"  # 占位：真正的版本号在 client/tauri/package.json，由 tauri.conf.json 引用
description = "BatterMC5Remake launcher"
authors = ["Batter MC"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-updater = "2"
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
