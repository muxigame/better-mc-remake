name: Build and deploy tagged release

on:
  push:
    tags:
      - "*"

permissions:
  contents: read

concurrency:
  group: production
  cancel-in-progress: false

env:
  REGISTRY: crpi-x67c1bi6evtlgf1e.cn-hongkong.personal.cr.aliyuncs.com
  SERVER_IMAGE: crpi-x67c1bi6evtlgf1e.cn-hongkong.personal.cr.aliyuncs.com/roc-shen-hk/mc-server
  WEB_IMAGE: crpi-x67c1bi6evtlgf1e.cn-hongkong.personal.cr.aliyuncs.com/roc-shen-hk/mc-web

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      image-tag: ${{ steps.meta.outputs.image_tag }}
    steps:
      - name: Check out tagged commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require tag commit to be on master
        shell: bash
        run: |
          git fetch origin master --no-tags
          git merge-base --is-ancestor "$GITHUB_SHA" origin/master

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: server/requirements.txt

      - name: Run backend tests
        run: |
          python -m pip install --disable-pip-version-check -r server/requirements-dev.txt
          PYTHONPATH=server python -m unittest discover -s server/tests -v

      - name: Create image tag
        id: meta
        shell: bash
        run: |
          safe_tag="${GITHUB_REF_NAME//[^A-Za-z0-9_.-]/-}"
          echo "image_tag=$safe_tag" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Alibaba Cloud Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: server/Dockerfile
          push: true
          provenance: false
          sbom: false
          tags: |
            ${{ env.SERVER_IMAGE }}:${{ steps.meta.outputs.image_tag }}
            ${{ env.SERVER_IMAGE }}:latest
          cache-from: type=gha,scope=server

      - name: Build and push web frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: server/web/Dockerfile
          push: true
          provenance: false
          sbom: false
          tags: |
            ${{ env.WEB_IMAGE }}:${{ steps.meta.outputs.image_tag }}
            ${{ env.WEB_IMAGE }}:latest
          cache-from: type=gha,scope=web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check out deployment files
        uses: actions/checkout@v4

      - name: Configure SSH
        shell: bash
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts

      - name: Transfer Compose and deployment script
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          scp compose.prod.yaml "$DEPLOY_USER@$DEPLOY_HOST:/opt/better-mc-remake/incoming/compose.yaml"
          scp scripts/deploy.sh "$DEPLOY_USER@$DEPLOY_HOST:/opt/better-mc-remake/incoming/deploy.sh"

      - name: Pull images and start Compose project
        shell: bash
        env:
          ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
          ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          IMAGE_TAG: ${{ needs.build.outputs.image-tag }}
        run: |
          ssh "$DEPLOY_USER@$DEPLOY_HOST" \
            "install -m 0644 /opt/better-mc-remake/incoming/compose.yaml /opt/better-mc-remake/compose.yaml && install -m 0750 /opt/better-mc-remake/incoming/deploy.sh /opt/better-mc-remake/deploy.sh"
          printf '%s\n' "$ACR_PASSWORD" | ssh "$DEPLOY_USER@$DEPLOY_HOST" \
            "/opt/better-mc-remake/deploy.sh '$IMAGE_TAG' '$ACR_USERNAME'"
